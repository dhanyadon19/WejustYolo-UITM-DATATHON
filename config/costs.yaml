fwa:
  description: >
    Fixed Wireless Access (4G/5G home broadband) on an EXISTING mobile network, per household. Retail price only:
    it assumes the nearby mobile site has spare capacity; no network build cost is included.
  monthly_rm: 99              # Yes 5G Advanced Home WiFi 'Gateway' plan, normal price, 24-month contract
  cpe_rm: 0                   # router included free on the 24-month contract (RRP RM1,199)
  five_year_cost_per_household_rm: 5940   # 99 x 60 (assumes the contract is renewed at the same price)
  notes:
    - "yes.my (accessed 2026-11-26): Gateway plan RM99/mth normal price, 24 months, FREE Infinite Gateway MAX Router (RRP RM1199); promo RM68/mth on 36 months not used"
    - "Other telcos list similar 5G home plans (RM69-RM149/mth); one official page is cited"
  accessed: "2026-11-26"
  sources:
    - https://www.yes.my/yes-5g-broadband/

not_costed:
  # Searched 2026-11-26 (news, MCMC/JENDELA pages, telco sites): no public Malaysian per-unit cost found.
  # Shown in the app as 'not costed (no public cost source)'. Never estimated.
  - small_cell
  - community_wifi_site
  - microwave_backhaul_link

decision_rule:
  # Five-year cost of one tower (capex + 5 x opex) = RM2.13m.
  # Break-even number of households where one tower costs the same as one Starlink terminal per household.
  # Compared with UNCONNECTED households (those the satellite cost pays for); build_costing.py case
  # rule_all_hh compares it with all households instead, as a sensitivity.
  breakeven_households_vs_starlink:
    residential: 144
    residential_lite: 228
  interpretation: >
    Below roughly 150-230 households without home internet within reach, satellite is likely cheaper over five years;
    above that, a tower is likely better value (and also serves mobile users). Treat as a screening
    rule, not an engineering decision. Fibre PoP is preferred where a fibre route already passes nearby.