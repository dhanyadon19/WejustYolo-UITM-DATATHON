  capex_per_site_rm:
    central: 1557143        # JENDELA 2 Sarawak: RM545m for ~350 locations
    low: 1557143
    high: 2650000           # first 300 SMART towers: RM795m
  capex_notes:
    - "JENDELA 2 stage 1 in Sarawak: six clusters, RM545m, about 350 locations (Bernama/The Star, 15 Oct 2026)"
