# Indicative connectivity intervention costs, Malaysia (RM)
# All figures are ESTIMATES derived from public statements and news reports, not engineering quotes.
# Per-site values are simple averages (total budget / number of sites); MCMC has said real per-site
# costs vary with terrain, typology and population density. Label them as estimates in the app.
# Compiled: 2026-11-19.

