    - https://www.thestar.com.my/news/nation/2026/07/27/five-perimeter-walls-each-costing-rm100000-built-to-curb-vandalism-of-telco-tower-sites-in-sarawak
    - https://soyacincau.com/2023/05/22/why-sarawak-has-nearly-500-naked-telco-towers/
    - https://newsarawaktribune.com.my/?p=360757
    - https://newswav.com/article/mcmc-invites-draft-plans-for-jendela-2-to-boost-national-connectivity-A2604_u6cmH1

