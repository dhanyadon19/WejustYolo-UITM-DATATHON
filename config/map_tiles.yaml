# External map tiles for the 3D terrain view of the Sarawak map (streamed by the browser, not downloaded).
# Checked 2026-11-24. Neither source needs an API key or account.

elevation:
  name: Terrain Tiles (AWS Open Data, Mapzen/Tilezen), terrarium encoding
  url: https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png
  # terrarium decoding, as documented in tilezen/joerd docs/formats.md:
  #   height_m = (red * 256 + green + blue / 256) - 32768
  decoder: {r: 256, g: 1, b: 0.00390625, offset: -32768}
  max_zoom: 15
  licence: >-
    Attribution required per underlying source (tilezen/joerd docs/attribution.md). Sarawak tiles report
    SRTM, GMTED2010 and ETOPO1 as sources (S3 header x-amz-meta-x-imagery-sources).
  attribution: >-
    Elevation: Terrain Tiles (AWS Open Data); SRTM and GMTED2010 terrain data courtesy of the U.S. Geological
    Survey; ETOPO1 terrain data U.S. National Oceanic and Atmospheric Administration
  sources:
    - https://registry.opendata.aws/terrain-tiles/
    - https://github.com/tilezen/joerd/blob/master/docs/attribution.md
    - https://github.com/tilezen/joerd/blob/master/docs/formats.md

imagery:
  name: EOxCloudless (Sentinel-2 cloudless) 2024
  url: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/GoogleMapsCompatible/{z}/{y}/{x}.jpg
  max_zoom: 14
  licence: >-
    CC BY-NC-SA 4.0 (all mosaics from 2018 onwards): free for non-commercial use with attribution;
    the public endpoint must not be used for commercial production apps; no SLA; avoid traffic bursts.
  attribution: >-
    Imagery: EOxCloudless 2024 (https://cloudless.eox.at) by EOX IT Services GmbH (Contains modified
    Copernicus Sentinel data 2024), CC BY-NC-SA 4.0
  sources:
    - https://cloudless.eox.at/documentation/license
    - https://cloudless.eox.at/documentation/faq
